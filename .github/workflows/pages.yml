name: Publish georgeporal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: georgeporal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: georgeporal/package-lock.json
      - run: npm ci
      - run: npm run build
      # The pages fetch src/ to display it, and load highlight.js from node_modules.
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/@highlightjs
          cp -r *.html styles.css dist src _site/
          cp -r node_modules/@highlightjs/cdn-assets _site/node_modules/@highlightjs/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: georgeporal/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
